<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8E7B9"/>
      <stop offset="25%" stop-color="#D4B06A"/>
      <stop offset="55%" stop-color="#C6A15B"/>
      <stop offset="80%" stop-color="#A37E36"/>
      <stop offset="100%" stop-color="#6E511D"/>
    </linearGradient>

    <!-- Bright Gold Highlight -->
    <linearGradient id="logoGoldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A8864A"/>
      <stop offset="40%" stop-color="#FFF4D4"/>
      <stop offset="70%" stop-color="#E0BF7A"/>
      <stop offset="100%" stop-color="#C6A15B"/>
    </linearGradient>

    <!-- Deep Shield Gradient -->
    <linearGradient id="logoShieldSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C2E33"/>
      <stop offset="50%" stop-color="#202124"/>
      <stop offset="100%" stop-color="#151618"/>
    </linearGradient>

    <!-- Burgundy Ambient Glow -->
    <radialGradient id="logoBurgundyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#702D3B" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#202124" stop-opacity="0"/>
    </radialGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ================= EMBLEM (0 to 64) ================= -->
  <g transform="translate(4, 2) scale(0.96)" filter="url(#logoGlow)">
    <!-- Outer Crest -->
    <path d="M30 3 L54 12 C54 35 43 51 30 60 C17 51 6 35 6 12 Z" 
          fill="url(#logoShieldSurface)" 
          stroke="url(#logoGold)" 
          stroke-width="1.8" 
          stroke-linejoin="round"/>

    <!-- Inner Border -->
    <path d="M30 7 L49 14 C49 33 40 45 30 54 C20 45 11 33 11 14 Z" 
          fill="none" 
          stroke="url(#logoGoldLight)" 
          stroke-width="0.8" 
          opacity="0.6"/>

    <!-- Burgundy Glow -->
    <circle cx="30" cy="28" r="16" fill="url(#logoBurgundyGlow)"/>

    <!-- Star of Excellence at Crown -->
    <polygon points="30,9 31.2,13 35,14.2 31.2,15.5 30,19.5 28.8,15.5 25,14.2 28.8,13" fill="url(#logoGoldLight)"/>

    <!-- Trophy Handles -->
    <path d="M22 23 C16 23 15 30 20 34 C21.5 35 23 35.5 24 35.5" fill="none" stroke="url(#logoGold)" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M38 23 C44 23 45 30 40 34 C38.5 35 37 35.5 36 35.5" fill="none" stroke="url(#logoGold)" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Trophy Chalice -->
    <path d="M21 21 L39 21 C39 21 40 31 35 36 C33 38 30 39.5 30 39.5 C30 39.5 27 38 25 36 C20 31 21 21 21 21 Z" 
          fill="url(#logoGoldLight)" 
          stroke="url(#logoGold)" 
          stroke-width="1"/>
    <line x1="20" y1="21" x2="40" y2="21" stroke="url(#logoGold)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M30 21 L30 39.5 C30 39.5 27 38 25 36 C20 31 21 21 21 21 Z" fill="#000" opacity="0.18"/>
    <polygon points="30,23 32,27 30,31 28,27" fill="#FFF" opacity="0.35"/>

    <!-- Stem and Pedestal Base -->
    <rect x="28.5" y="39.5" width="3" height="4.5" fill="url(#logoGold)"/>
    <rect x="23" y="44" width="14" height="2.5" rx="0.5" fill="url(#logoGoldLight)"/>
    <rect x="21" y="46.5" width="18" height="4" rx="1" fill="url(#logoShieldSurface)" stroke="url(#logoGold)" stroke-width="0.8"/>
    <rect x="24" y="47.5" width="12" height="2" rx="0.4" fill="url(#logoGold)"/>
  </g>

  <!-- ================= TYPOGRAPHY (70 onwards) ================= -->
  <!-- Main Brand Title: T&A ENGRAVING -->
  <text x="68" y="27" font-family="'Cinzel', 'Cinzel Decorative', 'Times New Roman', serif" font-size="20" font-weight="800" letter-spacing="1.5" fill="url(#logoGold)">
    T<tspan fill="#F8E7B9" font-weight="700">&amp;</tspan>A <tspan fill="#F8F5EF" font-weight="600" letter-spacing="2.5">ENGRAVING</tspan>
  </text>

  <!-- Elegant Gold Divider Line with Diamond Center -->
  <line x1="68" y1="36" x2="160" y2="36" stroke="url(#logoGold)" stroke-width="1" opacity="0.6"/>
  <polygon points="164,36 166.5,33.5 169,36 166.5,38.5" fill="url(#logoGold)"/>
  <line x1="173" y1="36" x2="265" y2="36" stroke="url(#logoGold)" stroke-width="1" opacity="0.6"/>

  <!-- Subtitle: TROPHIES & AWARDS · EST. 1987 -->
  <text x="69" y="49" font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="600" letter-spacing="2" fill="#B9BEC5">
    TROPHIES &amp; AWARDS <tspan fill="#C6A15B">✦</tspan> EST. 1987
  </text>
</svg>
