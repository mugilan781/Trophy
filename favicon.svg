<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEAB8"/>
      <stop offset="40%" stop-color="#D4B06A"/>
      <stop offset="75%" stop-color="#C6A15B"/>
      <stop offset="100%" stop-color="#8A6726"/>
    </linearGradient>
    <linearGradient id="favDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2F34"/>
      <stop offset="100%" stop-color="#161719"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Crest Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favDark)" stroke="url(#favGold)" stroke-width="2.5"/>

  <!-- Star of Excellence at Top -->
  <polygon points="32,9 33.5,13.5 38,15 33.5,16.5 32,21 30.5,16.5 26,15 30.5,13.5" fill="#FFF4D4"/>

  <!-- Trophy Handles -->
  <path d="M23 25 C15 25 14 34 21 39 C23 40 24.5 40.5 26 40.5" fill="none" stroke="url(#favGold)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M41 25 C49 25 50 34 43 39 C41 40 39.5 40.5 38 40.5" fill="none" stroke="url(#favGold)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Trophy Cup -->
  <path d="M22 23 L42 23 C42 23 43 35 37 41 C34 44 32 45 32 45 C32 45 30 44 27 41 C21 35 22 23 22 23 Z" fill="url(#favGold)"/>
  <path d="M32 23 L32 45 C32 45 30 44 27 41 C21 35 22 23 22 23 Z" fill="#000" opacity="0.2"/>
  <polygon points="32,25 35,32 32,38 29,32" fill="#FFF" opacity="0.4"/>

  <!-- Trophy Stem -->
  <rect x="30" y="45" width="4" height="5" fill="url(#favGold)"/>

  <!-- Base -->
  <rect x="23" y="50" width="18" height="4" rx="1" fill="#FFF4D4"/>
  <rect x="20" y="53.5" width="24" height="4.5" rx="1.5" fill="url(#favGold)"/>
</svg>
